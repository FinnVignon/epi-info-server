services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--bind-address=0.0.0.0"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-epi_info}
      MYSQL_USER: ${MYSQL_USER:-epi_info}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-epi_info_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-epi_info_root_password}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" --silent',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  server:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: ${SERVER_PORT:-4000}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-epi_info}
      MYSQL_USER: ${MYSQL_USER:-epi_info}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-epi_info_dev_password}
      DATABASE_MIGRATIONS_PATH: /app/database/migrations
      ASSET_STORAGE_PATH: /data/assets
      ASSET_UPLOAD_MAX_BYTES: ${ASSET_UPLOAD_MAX_BYTES:-524288000}
      ASSET_ARCHIVE_RETENTION_DAYS: ${ASSET_ARCHIVE_RETENTION_DAYS:-30}
      ASSET_CLEANUP_INTERVAL_HOURS: ${ASSET_CLEANUP_INTERVAL_HOURS:-24}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      ADMIN_DIST_PATH: /app/dist/admin
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-}
      CLIENT_ENROLLMENT_TOKEN_TTL_MINUTES: ${CLIENT_ENROLLMENT_TOKEN_TTL_MINUTES:-15}
      CLIENT_HEARTBEAT_INTERVAL_SECONDS: ${CLIENT_HEARTBEAT_INTERVAL_SECONDS:-30}
      CLIENT_OFFLINE_AFTER_SECONDS: ${CLIENT_OFFLINE_AFTER_SECONDS:-90}
    ports:
      - "4000:4000"
    volumes:
      - server-assets:/data/assets
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      default:
      epi-info:
        aliases:
          - epi-info-server

volumes:
  mysql-data:
  server-assets:

networks:
  epi-info:
    external: true
    name: epi-info-network
